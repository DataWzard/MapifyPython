<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visualize Python execution order and control flow without running the inspected code.">
  <title>MapifyPython</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.2/full/pyodide.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b15;
      --panel: #0f1728;
      --panel-2: #151f34;
      --line: #273652;
      --text: #edf4ff;
      --muted: #94a3b8;
      --blue: #62d3ff;
      --green: #55e6a5;
      --danger: #ff8a9b;
      --shadow: 0 20px 60px rgba(0, 0, 0, .3);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% -10%, rgba(67, 97, 238, .2), transparent 33rem),
        radial-gradient(circle at 90% 0%, rgba(85, 230, 165, .12), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 1600px;
      margin: auto;
      padding: 22px 28px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid #345071;
      border-radius: 12px;
      background: linear-gradient(145deg, #172641, #0d1526);
      color: var(--blue);
      font: 700 19px ui-monospace, monospace;
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }

    h1 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .tagline { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

    .privacy {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .privacy::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 42%) minmax(420px, 58%);
      gap: 16px;
      max-width: 1600px;
      height: calc(100vh - 96px);
      min-height: 640px;
      margin: auto;
      padding: 0 28px 28px;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(15, 23, 40, .88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .editor-panel { display: flex; flex-direction: column; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 56px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--line);
      background: rgba(21, 31, 52, .72);
    }

    .toolbar-title { margin-right: auto; font-weight: 650; font-size: 13px; }

    button, .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid #354665;
      border-radius: 8px;
      background: #17233a;
      color: var(--text);
      font: 600 12px inherit;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }

    button:hover, .file-button:hover { border-color: #5e789f; background: #1d2b47; }
    button:active, .file-button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: .55; }
    .primary { border-color: #2a8eb8; background: #0d6388; }
    .primary:hover { background: #107ba6; border-color: var(--blue); }
    input[type="file"] { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }

    #code {
      flex: 1;
      width: 100%;
      min-height: 420px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 20px;
      background: #0a1020;
      color: #d9e7ff;
      caret-color: var(--blue);
      font: 13px/1.65 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      tab-size: 4;
    }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 39px;
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    #status-dot { width: 7px; height: 7px; border-radius: 50%; background: #f6c85f; }
    #status-dot.ready { background: var(--green); }
    #status-dot.error { background: var(--danger); }

    .map-panel { display: flex; flex-direction: column; }
    .map-actions { margin-left: auto; }

    #empty {
      display: grid;
      place-items: center;
      flex: 1;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    #empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 17px; }
    #result { display: none; flex: 1; width: 100%; border: 0; background: #0b1020; }

    #error {
      display: none;
      margin: 14px;
      padding: 14px;
      overflow: auto;
      border: 1px solid #6d3443;
      border-radius: 10px;
      background: #2a1420;
      color: #ffc1cb;
      white-space: pre-wrap;
      font: 12px/1.5 ui-monospace, monospace;
    }

    @media (max-width: 900px) {
      header { padding: 17px; }
      .privacy { display: none; }
      main { grid-template-columns: 1fr; height: auto; padding: 0 17px 22px; }
      .panel { min-height: 580px; }
      .map-panel { height: 70vh; }
      .toolbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">Py</div>
      <div>
        <h1>MapifyPython</h1>
        <p class="tagline">See how Python code flows before it runs.</p>
      </div>
    </div>
    <div class="privacy">Analysis stays in your browser</div>
  </header>

  <main>
    <section class="panel editor-panel" aria-label="Python source editor">
      <div class="toolbar">
        <span class="toolbar-title" id="filename">script.py</span>
        <label class="file-button" for="file-input">Open .py</label>
        <input id="file-input" type="file" accept=".py,text/x-python,text/plain">
        <button id="sample-button" type="button">Sample</button>
        <button id="analyze-button" class="primary" type="button" disabled>Map code</button>
      </div>
      <textarea id="code" spellcheck="false" aria-label="Python source code">import json

def load_names(raw: str) -> list[str]:
    data = json.loads(raw)
    if not isinstance(data, list):
        raise ValueError("Expected a list")
    return [str(item) for item in data]

for name in load_names('["Ada", "Grace"]'):
    print(name)</textarea>
      <div class="statusbar">
        <span id="status-dot"></span>
        <span id="status">Loading the Python analyzer…</span>
      </div>
    </section>

    <section class="panel map-panel" aria-label="Execution map">
      <div class="toolbar">
        <span class="toolbar-title">Execution map</span>
        <div class="map-actions">
          <button id="download-button" type="button" disabled>Download HTML</button>
        </div>
      </div>
      <div id="empty">
        <div><strong>Your map will appear here</strong>Paste Python or open a file, then choose “Map code.”</div>
      </div>
      <pre id="error" role="alert"></pre>
      <iframe id="result" title="Generated Python execution map" sandbox="allow-scripts"></iframe>
    </section>
  </main>

  <script>
    const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/";
    const code = document.getElementById("code");
    const fileInput = document.getElementById("file-input");
    const filename = document.getElementById("filename");
    const analyzeButton = document.getElementById("analyze-button");
    const sampleButton = document.getElementById("sample-button");
    const downloadButton = document.getElementById("download-button");
    const result = document.getElementById("result");
    const empty = document.getElementById("empty");
    const errorBox = document.getElementById("error");
    const status = document.getElementById("status");
    const statusDot = document.getElementById("status-dot");
    let analyzer;
    let generatedHtml = "";

    function setStatus(message, state = "") {
      status.textContent = message;
      statusDot.className = state;
    }

    async function initialize() {
      try {
        const [runtime, analyzerSource] = await Promise.all([
          loadPyodide({ indexURL: PYODIDE_URL }),
          fetch("./mapify.py").then(response => {
            if (!response.ok) throw new Error("Could not load mapify.py from this site.");
            return response.text();
          })
        ]);
        runtime.FS.writeFile("mapify.py", analyzerSource);
        await runtime.runPythonAsync("import mapify");
        analyzer = runtime;
        analyzeButton.disabled = false;
        setStatus("Analyzer ready", "ready");
      } catch (error) {
        setStatus("Analyzer failed to load", "error");
        showError(error);
      }
    }

    function showError(error) {
      result.style.display = "none";
      empty.style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = String(error && error.message ? error.message : error);
      downloadButton.disabled = true;
    }

    async function mapCode() {
      if (!analyzer) return;
      const source = code.value;
      if (!source.trim()) {
        showError("Add some Python code first.");
        return;
      }

      analyzeButton.disabled = true;
      setStatus("Building execution map…");
      errorBox.style.display = "none";

      try {
        analyzer.globals.set("browser_source", source);
        analyzer.globals.set("browser_filename", filename.textContent || "script.py");
        generatedHtml = await analyzer.runPythonAsync(`
mapped = mapify.map_python_source(browser_source, browser_filename)
mapify.map_to_html(mapped, title=f"MapifyPython — {browser_filename}")
        `);
        result.srcdoc = generatedHtml;
        empty.style.display = "none";
        result.style.display = "block";
        downloadButton.disabled = false;
        setStatus("Map generated — inspected code was not executed", "ready");
      } catch (error) {
        showError(error);
        setStatus("Check the Python syntax and try again", "error");
      } finally {
        analyzeButton.disabled = false;
      }
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      code.value = await file.text();
      filename.textContent = file.name;
      setStatus("File loaded — ready to map", "ready");
    });

    sampleButton.addEventListener("click", () => {
      code.value = `from pathlib import Path

def count_lines(folder: Path) -> int:
    total = 0
    for file in folder.glob("*.py"):
        try:
            total += len(file.read_text().splitlines())
        except OSError:
            continue
    return total

print(count_lines(Path(".")))`;
      filename.textContent = "sample.py";
    });

    analyzeButton.addEventListener("click", mapCode);
    code.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") mapCode();
      if (event.key === "Tab") {
        event.preventDefault();
        const start = code.selectionStart;
        code.setRangeText("    ", start, code.selectionEnd, "end");
      }
    });

    downloadButton.addEventListener("click", () => {
      const blob = new Blob([generatedHtml], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${filename.textContent.replace(/\.py$/i, "") || "python"}-map.html`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    });

    initialize();
  </script>
</body>
</html>
